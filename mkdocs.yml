site_name: SolOrder
site_description: Structural order parameters for water and ice simulations
site_author: Dibyendu Maity
site_url: https://dmighty007.github.io/SolOrder/
repo_url: https://github.com/dmighty007/SolOrder
repo_name: dmighty007/SolOrder
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/logo22.gif
  favicon: images/logo22.gif
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: false
            separate_signature: true
            members_order: source
            heading_level: 2

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Beginner's guide:
      - Installation: guide/installation.md
      - First steps: guide/first-steps.md
      - A tour of order parameters: guide/order-parameters.md
      - Classifying ice: guide/ice-classification.md
      - Choosing a parameter: guide/choosing-a-parameter.md
      - Working with trajectories: guide/trajectories.md
      - Tips and common mistakes: guide/tips.md
  - Reference:
      - Analysis classes: api/analysis.md
      - Result types: api/results.md
      - Core parameters: order_parameters.md
      - Extended parameters: extended_parameters.md
      - Implementation status: order_parameter_status.md
  - Validation:
      - GenIce structures: validation/genice.md
      - Nucleation configurations: validation/nucleation/README.md
  - Research:
      - Benchmark design: benchmark_design.md
      - Research workflow: research_workflow.md

# Old README notebook export; superseded by the guide.
exclude_docs: |
  images/SolOrder.md
